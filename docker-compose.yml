version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: signallab-backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=signallab-secret-key-prod-2026
      - DATABASE_URL=sqlite:////app/data/signallab.db
    volumes:
      - ./content:/app/content
      - backend_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: signallab-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:

